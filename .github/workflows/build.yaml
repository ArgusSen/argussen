# Tests ArgusSen and builds the Home Assistant app image ghcr.io/argussen/argussen:<version> (amd64 + aarch64).
# Each architecture is built natively on its own runner (no emulation), so the Rust build of Blue Onyx stays fast.
# Images are only pushed from the main branch; pull requests are built and tested without pushing.
# A version that is already published is never overwritten: the build is then skipped (tests still run) – raise
# "version" in argussen/config.yaml to publish a new one.
# The actions are pinned to commits (the tag is in the comment).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: argussen/server/go.mod
      - name: Go vet and tests
        working-directory: argussen/server
        run: |
          go vet ./...
          go test ./...
      - name: Translations are complete
        run: |
          python3 argussen/i18n/build.py
          git diff --exit-code argussen/web/i18n.js || { echo "web/i18n.js is not up to date – run python3 argussen/i18n/build.py"; exit 1; }
      - name: JavaScript syntax
        run: node --check argussen/web/app.js

  # the Home Assistant integration (custom_components/argussen) with Home Assistant's own test tools
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Integration tests
        run: |
          pip install pytest-homeassistant-custom-component==0.13.316 PyTurboJPEG==2.6.1
          python -m pytest -p no:cacheprovider

  build:
    needs: [test, integration]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: info
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' argussen/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already published?
        id: published
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          V=${{ steps.info.outputs.version }}
          if docker buildx imagetools inspect ghcr.io/argussen/argussen:$V >/dev/null 2>&1; then
            echo "::notice::Version $V is already published – not built again (raise version in argussen/config.yaml)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: argussen
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          provenance: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/argussen/argussen:${{ steps.info.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # one multi-arch image (config.yaml: image: ghcr.io/argussen/argussen) from the two architectures
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: info
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' argussen/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch image
        run: |
          V=${{ steps.info.outputs.version }}
          if docker buildx imagetools inspect ghcr.io/argussen/argussen:$V >/dev/null 2>&1; then
            echo "::notice::Version $V is already published"; exit 0
          fi
          docker buildx imagetools create -t ghcr.io/argussen/argussen:$V -t ghcr.io/argussen/argussen:latest \
            ghcr.io/argussen/argussen:$V-amd64 ghcr.io/argussen/argussen:$V-aarch64
